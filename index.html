<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بازی فرار علی (Ali Escape)</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: Tahoma, sans-serif; }
        #gameCanvas { display: block; margin: 0 auto; background: #555; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; font-size: 20px; }
    </style>
</head>
<body>
    <div id="ui">امتیاز: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        canvas.width = 400;
        canvas.height = 600;

        // بارگذاری تصاویر
        const aliImg = new Image(); aliImg.src = 'ali.png';
        const girlImg = new Image(); girlImg.src = 'girl.png';

        let score = 0;
        let gameRunning = true;

        let ali = { x: 180, y: 500, w: 40, h: 60, speed: 5 };
        let girl = { x: 180, y: 650, w: 50, h: 70, speed: 2 };
        let obstacles = [];

        // کنترل با کیبورد
        window.addEventListener('keydown', (e) => {
            if (e.key === "ArrowLeft" && ali.x > 50) ali.x -= 100;
            if (e.key === "ArrowRight" && ali.x < 300) ali.x += 100;
        });

        function createObstacle() {
            let xPos = [50, 150, 250][Math.floor(Math.random() * 3)];
            obstacles.push({ x: xPos, y: -50, w: 60, h: 30 });
        }
        setInterval(createObstacle, 1500);

        function update() {
            if (!gameRunning) return;

            // حرکت موانع
            obstacles.forEach((obs, index) => {
                obs.y += 5;
                if (obs.y > 600) { obstacles.splice(index, 1); score += 10; document.getElementById('score').innerText = score; }

                // برخورد با مانع
                if (ali.x < obs.x + obs.w && ali.x + ali.w > obs.x && ali.y < obs.y + obs.h && ali.y + ali.h > obs.y) {
                    girl.y = 520; // دختر نزدیک میشه
                }
            });

            // تعقیب دختر
            if (girl.y > ali.y) girl.y -= 0.5;
            if (girl.y <= ali.y) {
                gameRunning = false;
                alert("گرفتت! بازی تموم شد. امتیاز شما: " + score);
                location.reload();
            }

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // رسم علی
            ctx.drawImage(aliImg, ali.x, ali.y, ali.w, ali.h);
            // رسم دختر
            ctx.drawImage(girlImg, girl.x, girl.y, girl.w, girl.h);
            // رسم موانع
            ctx.fillStyle = "red";
            obstacles.forEach(obs => ctx.fillRect(obs.x, obs.y, obs.w, obs.h));
        }

        update();
    </script>
</body>
</html>
